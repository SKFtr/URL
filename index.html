<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom URL Shortener</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-color: #1F2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="url"],
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .prefix-wrapper {
            display: flex;
            align-items: center;
        }

        .prefix {
            background-color: #E5E7EB;
            padding: 0.75rem;
            border: 1px solid #D1D5DB;
            border-right: none;
            border-radius: 6px 0 0 6px;
            color: #6B7280;
            font-size: 0.9rem;
        }

        .prefix-wrapper input {
            border-radius: 0 6px 6px 0;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4338CA;
        }

        #result-container {
            display: none;
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #ECFDF5;
            border: 1px solid #10B981;
            border-radius: 6px;
            text-align: center;
        }

        #short-url {
            color: #047857;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
            word-break: break-all;
        }

        .copy-btn {
            margin-top: 0.75rem;
            background-color: #10B981;
            padding: 0.5rem;
            font-size: 0.85rem;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .copy-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Shorten Your Link</h2>
        <form id="shorten-form">
            <div class="form-group">
                <label for="long-url">Destination URL (Big URL)</label>
                <input type="url" id="long-url" placeholder="https://example.com/very/long/url" required>
            </div>
            
            <div class="form-group">
                <label for="custom-alias">Custom Alias (Optional)</label>
                <div class="prefix-wrapper">
                    <!-- Updated to match the real API domain -->
                    <span class="prefix">is.gd/</span>
                    <input type="text" id="custom-alias" placeholder="my-custom-link" pattern="[a-zA-Z0-9-_]+" title="Only letters, numbers, dashes, and underscores allowed">
                </div>
            </div>

            <button type="submit">Shorten URL</button>
        </form>

        <div id="result-container">
            <p style="margin: 0 0 0.5rem 0; font-size: 0.9rem;">Your short URL is ready:</p>
            <a href="#" id="short-url" target="_blank"></a>
            <br>
            <button class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('shorten-form');
        const resultContainer = document.getElementById('result-container');
        const shortUrlDisplay = document.getElementById('short-url');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const longUrl = encodeURIComponent(document.getElementById('long-url').value);
            const customAlias = document.getElementById('custom-alias').value.trim();
            
            // Show a loading message while waiting for the API
            shortUrlDisplay.textContent = "Generating link...";
            shortUrlDisplay.removeAttribute('href');
            resultContainer.style.display = 'block';

            // Build the URL to talk to the free is.gd API
            let apiUrl = `https://is.gd/create.php?format=json&url=${longUrl}&callback=handleApiResponse`;
            
            if (customAlias) {
                apiUrl += `&shorturl=${encodeURIComponent(customAlias)}`;
            }

            // Inject a temporary script to get around browser security limits (JSONP method)
            const script = document.createElement('script');
            script.src = apiUrl;
            
            // Clean up the script tag immediately after it runs
            script.onload = () => document.body.removeChild(script);
            document.body.appendChild(script);
        });

        // This function is automatically triggered when the is.gd server replies
        function handleApiResponse(data) {
            if (data.shorturl) {
                // Success: Display the real, workable link
                shortUrlDisplay.textContent = data.shorturl;
                shortUrlDisplay.href = data.shorturl;
            } else if (data.errorcode) {
                // Failure: The alias was probably taken by someone else
                shortUrlDisplay.textContent = "Error: " + data.errormessage;
                shortUrlDisplay.removeAttribute('href');
            }
        }

        function copyToClipboard() {
            const textToCopy = shortUrlDisplay.textContent;
            
            // Prevent copying if there was an error
            if(textToCopy.startsWith("Error")) return; 
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyBtn = document.querySelector('.copy-btn');
                const originalText = copyBtn.textContent;
                copyBtn.textContent = "Copied!";
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom URL Shortener</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-color: #1F2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="url"],
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .prefix-wrapper {
            display: flex;
            align-items: center;
        }

        .prefix {
            background-color: #E5E7EB;
            padding: 0.75rem;
            border: 1px solid #D1D5DB;
            border-right: none;
            border-radius: 6px 0 0 6px;
            color: #6B7280;
            font-size: 0.9rem;
        }

        .prefix-wrapper input {
            border-radius: 0 6px 6px 0;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4338CA;
        }

        #result-container {
            display: none;
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #ECFDF5;
            border: 1px solid #10B981;
            border-radius: 6px;
            text-align: center;
        }

        #short-url {
            color: #047857;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
            word-break: break-all;
        }

        .copy-btn {
            margin-top: 0.75rem;
            background-color: #10B981;
            padding: 0.5rem;
            font-size: 0.85rem;
        }

        .copy-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Shorten Your Link</h2>
        <form id="shorten-form">
            <div class="form-group">
                <label for="long-url">Destination URL (Big URL)</label>
                <input type="url" id="long-url" placeholder="https://example.com/very/long/url" required>
            </div>
            
            <div class="form-group">
                <label for="custom-alias">Custom Alias (Optional)</label>
                <div class="prefix-wrapper">
                    <span class="prefix">short.ly/</span>
                    <input type="text" id="custom-alias" placeholder="my-custom-link" pattern="[a-zA-Z0-9-_]+" title="Only letters, numbers, dashes, and underscores allowed">
                </div>
            </div>

            <button type="submit">Shorten URL</button>
        </form>

        <div id="result-container">
            <p style="margin: 0 0 0.5rem 0; font-size: 0.9rem;">Your custom short URL is ready:</p>
            <a href="#" id="short-url" target="_blank"></a>
            <button class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('shorten-form');
        const resultContainer = document.getElementById('result-container');
        const shortUrlDisplay = document.getElementById('short-url');
        
        // The mock domain for your short links
        const domain = "https://short.ly/";

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent page reload

            const longUrl = document.getElementById('long-url').value;
            let customAlias = document.getElementById('custom-alias').value.trim();

            // If the user didn't provide a custom alias, generate a random 6-character string
            if (!customAlias) {
                customAlias = generateRandomString(6);
            }

            // Create the final short URL
            const finalShortUrl = domain + customAlias;

            // Display the result
            shortUrlDisplay.textContent = finalShortUrl;
            shortUrlDisplay.href = longUrl; // In a real app, the short URL would redirect to this
            resultContainer.style.display = 'block';
        });

        // Helper function to generate a random string
        function generateRandomString(length) {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

        // Helper function to copy the URL to the user's clipboard
        function copyToClipboard() {
            const textToCopy = shortUrlDisplay.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyBtn = document.querySelector('.copy-btn');
                const originalText = copyBtn.textContent;
                copyBtn.textContent = "Copied!";
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
